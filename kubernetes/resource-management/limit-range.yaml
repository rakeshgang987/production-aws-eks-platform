apiVersion: v1
kind: LimitRange

metadata:
  name: production-eks-platform-limits
  namespace: production-eks-platform

spec:
  limits:
    - type: Container

      min:
        cpu: "50m"
        memory: "64Mi"

      max:
        cpu: "2"
        memory: "2Gi"

      default:
        cpu: "500m"
        memory: "512Mi"

      defaultRequest:
        cpu: "100m"
        memory: "128Mi"