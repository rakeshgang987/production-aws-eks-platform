apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: production-app-ingress
  namespace: production-eks-platform

  annotations:
    description: "Ingress routing for production EKS platform"

spec:
  ingressClassName: nginx

  rules:
    - host: production-app.local

      http:
        paths:

          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80


          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 3000