name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  # ============================================================
  # CI - Backend Tests
  # ============================================================
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: products_db
          POSTGRES_USER: app_user
          POSTGRES_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app_user -d products_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: application/backend

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: products_db
      DB_USER: app_user
      DB_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: application/backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Initialize test database
        env:
          PGPASSWORD: ${{ secrets.TEST_DB_PASSWORD }}
        run: |
          psql \
            -h "$DB_HOST" \
            -p "$DB_PORT" \
            -U "$DB_USER" \
            -d "$DB_NAME" \
            -f ../database/init.sql

      - name: Run tests
        run: npm test


  # ============================================================
  # CI - Frontend Lint and Build
  # ============================================================
  frontend-check:
    name: Frontend Lint and Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: application/frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: application/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build frontend
        run: npm run build


  # ============================================================
  # CD - Build and Push Docker Images
  # ============================================================
  docker-build-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    needs:
      - backend-test
      - frontend-check

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    env:
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build backend image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/production-aws-eks-platform-backend:${IMAGE_TAG} \
            -f application/backend/Dockerfile \
            application

      - name: Build frontend image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/production-aws-eks-platform-frontend:${IMAGE_TAG} \
            -f application/frontend/Dockerfile \
            application

      - name: Push backend image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/production-aws-eks-platform-backend:${IMAGE_TAG}

      - name: Push frontend image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/production-aws-eks-platform-frontend:${IMAGE_TAG}


  # ============================================================
  # CD - Helm Deployment
  # ============================================================
  helm-deploy:
    name: Helm Deployment
    runs-on: ubuntu-latest

    needs:
      - docker-build-push

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    env:
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.18.4

      - name: Helm lint
        run: helm lint helm

      - name: Helm template validation
        run: |
          helm template production-aws-eks-platform helm \
            --namespace production-eks-platform-helm \
            --set backend.image.repository=docker.io/${{ secrets.DOCKERHUB_USERNAME }}/production-aws-eks-platform-backend \
            --set backend.image.tag="${IMAGE_TAG}" \
            --set frontend.image.repository=docker.io/${{ secrets.DOCKERHUB_USERNAME }}/production-aws-eks-platform-frontend \
            --set frontend.image.tag="${IMAGE_TAG}"

      - name: Display deployment image tags
        run: |
          echo "Backend image:"
          echo "docker.io/${{ secrets.DOCKERHUB_USERNAME }}/production-aws-eks-platform-backend:${IMAGE_TAG}"

          echo "Frontend image:"
          echo "docker.io/${{ secrets.DOCKERHUB_USERNAME }}/production-aws-eks-platform-frontend:${IMAGE_TAG}"